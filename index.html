/* CINQ OBJECTIFS SUR DEUX LIGNES. Secher et perdre du poids se
   ressemblent de loin : la seconde ligne est ce qui permet de choisir
   entre les deux, elle n'est pas decorative. */
function renderGoals(){
  const L = document.getElementById('goalList'); L.innerHTML='';
  GOALS.forEach(g=>{
    const el = document.createElement('div');
    el.className = 'opt' + (g.id===state.goal?' sel':'');
    el.innerHTML = `<span class="k">${g.k}</span>
      <span class="ob"><span class="n">${LANG==='fr'?g.fr:g.en}</span>
        <span class="od">${g.sub[LANG]}</span></span>
      <span class="dot"></span>`;
    el.onclick = ()=>{
      state.goal = g.id; save();
      [...L.children].forEach(c=>c.classList.remove('sel'));
      el.classList.add('sel');
      renderDay();            /* le deficit change les deux colonnes */
    };
    L.appendChild(el);
  });
}
function renderSports(){
  const L = document.getElementById('sportList'); L.innerHTML='';
  SPORTS.forEach(s=>{
    const b = document.createElement('button');
    b.className = 'chip' + (s===state.sport?' sel':'');
    b.textContent = s;
    b.onclick = ()=>{
      state.sport = s; save();
      [...L.children].forEach(c=>c.classList.remove('sel'));
      b.classList.add('sel');
    };
    L.appendChild(b);
  });
}
function bindSeg(id, key, cast, after){
  const seg = document.getElementById(id);
  [...seg.children].forEach(b=>{
    b.classList.toggle('sel', String(state[key]) === b.dataset.v);
    b.onclick = ()=>{
      [...seg.children].forEach(c=>c.classList.remove('sel'));
      b.classList.add('sel');
      state[key] = cast ? cast(b.dataset.v) : b.dataset.v;
      save(); if(after) after();
    };
  });
}
/* 5,5 h et non 5.5 h : on est en francais, et le curseur avance par
   demi-heures. */
const fmtH = v => (LANG==='fr' ? String(v).replace('.',',') : String(v));

function bindRange(id, key, unitKey, fmt, after){
  const r = document.getElementById(id), out = document.getElementById(id+'V');
  const paint = v => { out.innerHTML = (fmt?fmt(v):v) + `<small>${t(unitKey)}</small>`; };
  r.value = state[key];
  paint(state[key]);
  r.oninput = ()=>{
    state[key] = +r.value;
    paint(state[key]);
    save(); if(after) after();
  };
}

/* CE QUE LES DEUX CURSEURS VEULENT DIRE, EN CLAIR. Un client ne sait pas
   ce que vaut "5 h par semaine" ; il sait ce que vaut "1 h 15 par
   seance, environ 490 kcal". */
function renderLoad(){
  const el = document.getElementById('loadWhy');
  if(!el) return;
  const e = energy();
  if(state.hpw === 0 || state.days === 0){
    el.innerHTML = t('load.none');
    return;
  }
  const perSession = state.hpw / state.days;
  const hh = Math.floor(perSession), mm = Math.round((perSession-hh)*60);
  const dur = mm ? `${hh} h ${String(mm).padStart(2,'0')}` : `${hh} h`;
  el.innerHTML = t('load.d')
    .replace('{dur}', `<b>${dur}</b>`)
    .replace('{kcal}', `<b>${Math.round(e.session)}</b>`)
    .replace('{week}', `<b>${Math.round(e.week)}</b>`);
}

/* LA REPONSE A LA QUESTION DU JOUR DE REPOS, EN CHIFFRES.
   Non : on ne consomme pas autant. Mais l'ecart n'est pas un
   pourcentage arbitraire, c'est exactement le cout de la seance — et
   les proteines, elles, ne bougent pas. */
function renderDay(){
  const box = document.getElementById('dayCmp');
  if(!box) return;
  const e = energy();
  const g = GOALS.find(x=>x.id===state.goal) || GOALS[0];
  const tr = Math.round(e.training * g.kcal), rs = Math.round(e.rest * g.kcal);
  const cell = (k, v, sel)=>`<div class="dc${sel?' sel':''}">
    <div class="dk">${t(k)}</div>
    <div class="dv">${v.toLocaleString('fr-FR')}<small>KCAL</small></div></div>`;
  box.innerHTML = cell('ctx.training', tr, state.day==='training')
                + cell('ctx.rest', rs, state.day==='rest');
  const gap = tr - rs;
  const why = document.getElementById('dayWhy');
  if(!why) return;
  why.innerHTML = gap > 0
    ? `<span class="daygap">${t('day.gap').replace('{gap}', '<b>'+gap+'</b>')}</span>
       <br>${t('day.sci')}`
    : t('day.nosport');
}
function renderCtxChips(){
  const L = document.getElementById('ctxList'); L.innerHTML='';
  Object.keys(CONTEXTS).forEach(c=>{
    const b = document.createElement('button');
    b.className='chip'; b.dataset.ctx=c;
    b.textContent = (LANG==='fr' ? CONTEXTS[c].frn : c);
    b.onclick = ()=>{ state.ctx=c; save(); syncCtx(); };
    L.appendChild(b);
  });
}
function syncCtx(){
  const L = document.getElementById('ctxList');
  if(!L.children.length) return;
  const avail = Object.keys(CONTEXTS).filter(k=>CONTEXTS[k].days.includes(state.day));
  if(!avail.includes(state.ctx)) state.ctx = state.day==='rest' ? 'REGULAR MEAL' : 'POST-WORKOUT';
  [...L.children].forEach(b=>{
    b.classList.toggle('off', !avail.includes(b.dataset.ctx));
    b.classList.toggle('sel', b.dataset.ctx===state.ctx);
  });
  const c = CONTEXTS[state.ctx];
  document.getElementById('ctxWhy').innerHTML =
    `<b>${c.rule[LANG]}</b> &nbsp;\u2248&nbsp;${Math.round(c.share*100)}% ${t('u.ofday').toLowerCase()}.`;
  save();
}

/* ---------------------------------------------------------------------
   13. ECRAN RATIO
   ------------------------------------------------------------------ */
function renderRatio(){
  const tg = computeRatio();
  state.hasRatio = true; save();
  const c = CONTEXTS[state.ctx];
  const ctxName = LANG==='fr' ? c.frn : state.ctx;
  document.getElementById('rCtx').textContent =
    `${state.sport} · ${state.goal} · ${t('ratio.day.'+state.day)}`;
  document.getElementById('rKcal').innerHTML =
    `${tg.kcal[0]}\u2013${tg.kcal[1]}<small>KCAL · ${ctxName} · ` +
    `${Math.round(c.share*100)}% ${t('u.ofday')}</small>`;
  document.getElementById('rP').textContent = `${tg.p[0]}\u2013${tg.p[1]}`;
  document.getElementById('rC').textContent = `${tg.c[0]}\u2013${tg.c[1]}`;
  document.getElementById('rF').textContent = `${tg.f[0]}\u2013${tg.f[1]}`;
  document.getElementById('rRule').textContent = c.rule[LANG];
  document.getElementById('rWhy').textContent  = c.why[LANG];
}

/* ---------------------------------------------------------------------
   14. LA CARTE
   Les signatures sont classees par accord avec le RATIO : le premier
   bowl de la liste est celui qui tombe le mieux dans vos fourchettes.
   Sans RATIO, l'ordre reste celui de la carte.
   ------------------------------------------------------------------ */
function renderMenu(){
  /* bandeau RATIO */
  const rb = document.getElementById('menuRatio');
  if(state.hasRatio){
    const tg = state.target || computeRatio();
    const c = CONTEXTS[state.ctx];
    rb.innerHTML = `<div class="ratiobar"><div class="l">
      <div class="t">${t('menu.ratio.on')} · ${LANG==='fr'?c.frn:state.ctx}</div>
      <div class="v">${tg.kcal[0]}\u2013${tg.kcal[1]} kcal &nbsp;·&nbsp;
        P ${tg.p[0]}\u2013${tg.p[1]} &nbsp;C ${tg.c[0]}\u2013${tg.c[1]}
        &nbsp;F ${tg.f[0]}\u2013${tg.f[1]}</div>
      </div><div class="ed">${t('menu.ratio.edit')}</div></div>`;
  } else {
    rb.innerHTML = `<div class="ratiobar"><div class="l">
      <div class="t">${t('menu.ratio.off')}</div>
      <div class="v" style="font-size:12px;color:var(--muted)">${t('menu.ratio.offv')}</div>
      </div><div class="ed">${t('menu.ratio.set')}</div></div>`;
  }
  rb.querySelector('.ratiobar').onclick = ()=>show('v-goal');

  gaugePanel('gaugesMenu');

  const body = document.getElementById('menuBody');
  body.innerHTML = '';

  /* TOUS LES MOMENTS NE SE SERVENT PAS DANS UN BOL. Avant l'effort, au
     petit-dejeuner, sur un en-cas, le bowl n'est pas la reponse : on le
     dit, on remonte les sections du moment, et on propose un assemblage
     a l'unite plutot que de laisser le client deviner. */
  const cx = CONTEXTS[state.ctx] || CONTEXTS['REGULAR MEAL'];
  const bowlFirst = !state.hasRatio || cx.bowl !== false;

  if(!bowlFirst){
    const nw = document.createElement('div');
    nw.className = 'sec';
    nw.innerHTML = `<div class="sec-h">
        <span class="nm">${LANG==='fr' ? cx.frn : state.ctx}</span>
        <span class="tg">\u2248 ${Math.round(cx.share*100)} % ${t('u.ofday').toLowerCase()}</span></div>
      <div class="bowl" style="border-bottom:0;cursor:default">
        <div class="ing" style="color:var(--ink)">${cx.rule[LANG]}</div>
        <div class="ing">${cx.why[LANG]}</div></div>`;
    body.appendChild(nw);

    /* L'EQUIVALENT DU TRAVAIL FAIT SUR LES BOWLS, applique a la carte a
       l'unite : un article ou une paire, classes par accord. C'est la
       proposition "un jus et une patisserie proteinee" rendue par le
       moteur au lieu d'etre laissee au hasard. */
    const combos = bestUnitCombos(state.ctx, 3);
    if(combos.length){
      const cwx = document.createElement('div');
      cwx.className = 'sec';
      cwx.innerHTML = `<div class="sec-h"><span class="nm">${t('menu.combo')}</span>
        <span class="tg">${t('menu.combo.tag')}</span></div>`;
      combos.forEach((o,i)=>{
        const el = document.createElement('div');
        el.className = 'bowl';
        let badge = '';
        const lb = i === 0 ? fitLabel(o.fit) : null;
        if(lb) badge = `<div class="fitbadge ${lb.cls}">${lb.cls ? '\u25cb' : '\u25cf'}
          ${t(lb.k)}</div>`;
        const names = o.items.map(nameOf).join(' + ');
        el.innerHTML = badge + `
          <div class="top"><span class="nm">${names}</span>
            <span class="pr">${eur(o.price)}</span></div>
          <div class="ing" style="color:var(--muted);font-size:11.5px">${
            o.items.map(it=>`${it.g} ${it.u}`).join(' · ')}</div>
          <div class="mac">${Math.round(o.macros.kcal)} KCAL &nbsp;·&nbsp;
            P${o.macros.p.toFixed(0)} &nbsp;C${o.macros.c.toFixed(0)}
            &nbsp;F${o.macros.f.toFixed(0)}</div>
          <div class="acts">
            <button class="btn sm"><span>${t('menu.add')}</span></button>
          </div>`;
        el.querySelector('button').onclick = (ev)=>{
          ev.stopPropagation();
          o.items.forEach(it=>addUnit(it, 1));
          show('v-order');
        };
        cwx.appendChild(el);
      });
      body.appendChild(cwx);
    }
  }

  /* --- les signatures, assemblees et classees par accord --- */
  const sigs = SIGNATURES.map(bestAssembly);
  if(state.hasRatio){
    sigs.sort((a,b)=> b.fit.inRange - a.fit.inRange || a.fit.dist - b.fit.dist);
  }

  const sw = document.createElement('div');
  sw.className = 'sec';
  sw.innerHTML = `<div class="sec-h"><span class="nm">${t('menu.sig')}</span>
    <span class="tg">${bowlFirst ? t('menu.sig.tag') : t('menu.sig.later')}</span></div>`;

  sigs.forEach((o, i)=>{
    const {sig:s, v, bits, compl:cp, macros:m, price, fit:ft} = o;
    const el = document.createElement('div');
    el.className = 'bowl';

    /* Badge qualitatif, sur la premiere carte seulement : c'est une
       recommandation, pas une note attribuee a chaque plat. */
    let badge = '';
    const lb = i === 0 ? fitLabel(ft) : null;
    if(lb) badge = `<div class="fitbadge ${lb.cls}">${lb.cls ? '\u25cb' : '\u25cf'}
      ${t(lb.k)}</div>`;

    const ing = v.comps.map(([k,q])=>{
      const it = ITEM[k];
      return nameOf(it) + (q !== 1 ? ` \u00d7${q}` : '');
    }).join(' · ');

    /* La portion dite en clair : "base genereuse, double proteine".
       C'est ce que le comptoir doit entendre, pas un code S/M/L. */
    const sized = bits.length
      ? `<div class="ing" style="color:var(--olive);font-size:11.5px">${bits.join(' · ')}</div>`
      : '';
    const compl = cp
      ? `<div class="compl"><span class="pl">+</span>
         <span class="cn">${nameOf(cp)}</span>
         <span class="cw">${t('menu.compl')}</span></div>`
      : '';

    el.innerHTML = badge + thumb('bowl-' + s.id) + `
      <div class="top"><span class="nm">${s.n}</span><span class="pr">${eur(price)}</span></div>
      <div class="ing">${s.d[LANG]}</div>
      <div class="ing" style="color:var(--muted);font-size:11.5px">${ing}</div>
      ${sized}${compl}
      <div class="mac">${Math.round(m.kcal)} KCAL &nbsp;·&nbsp; P${m.p.toFixed(0)}
        &nbsp;C${m.c.toFixed(0)} &nbsp;F${m.f.toFixed(0)}</div>
      <div class="acts">
        <div class="stepper">
          <button data-m="-1" aria-label="${t('a11y.less')}">\u2212</button>
          <span class="q" data-q></span>
          <button data-m="1" aria-label="${t('a11y.more')}">+</button>
        </div>
        <button class="btn ghost sm" data-a="adj"><span>${t('menu.adjust')}</span></button>
      </div>`;

    /* LE BOWL SE COMPTE SUR PLACE. Avant, AJOUTER posait une ligne puis
       sautait a la commande : pour prendre deux bowls et un jus il fallait
       faire l'aller-retour trois fois. Le stepper laisse composer le repas
       sans quitter la carte — c'est la barre basse, qui apparait des le
       premier article, qui sert desormais de sortie. */
    const paint = ()=>{
      const q = sigQty(s.id, bits.join(' \u00b7 ') || null);
      const qe = el.querySelector('[data-q]');
      qe.textContent = q || '0';
      qe.classList.toggle('zero', !q);
      el.classList.toggle('active', !!q);
      /* la jauge suit le stepper d'un bowl comme celui d'un jus */
      updateGauges();
    };
    el.querySelectorAll('.stepper button').forEach(b=>{
      b.onclick = (ev)=>{ ev.stopPropagation(); addSig(o, +b.dataset.m); paint(); };
    });
    paint();
    el.querySelector('[data-a=adj]').onclick = (ev)=>{
      ev.stopPropagation();
      state.qty = {}; v.comps.forEach(([k,q])=>{ state.qty[k]=q; });
      state.editing = s.id;
      show('v-build');
    };
    sw.appendChild(el);
  });

  /* --- composer : EN TETE DU BLOC BOWLS, avant les signatures --- */
  const cw = document.createElement('div');
  cw.className = 'sec';
  cw.id = 'sec-BOWLS';
  cw.dataset.jump = 'BOWLS';
  cw.innerHTML = `<div class="sec-h"><span class="nm">${t('menu.custom')}</span>
    <span class="tg">${eur(BOWL_PRICE)}</span></div>
    <div class="bowl" style="border-bottom:0">
      <div class="ing">${t('menu.custom.d')}</div>
      <div class="acts"><button class="btn sm"><span>${t('menu.custom')}</span>
        <span class="ar">\u2192</span></button></div>
    </div>`;
  cw.querySelector('button').onclick = ()=>{
    state.qty = {}; state.editing = null; show('v-build');
  };

  /* --- sections a l'unite --- */
  const units = [];
  MENU.filter(s=>s.unit).forEach(sec=>{
    const w = document.createElement('div');
    w.className = 'sec';
    w.id = 'sec-' + sec.sec.replace(/[^A-Z]+/g, '-');
    w.dataset.jump = sec.sec;
    w.innerHTML = `<div class="sec-h"><span class="nm">${LANG==='fr'?sec.fr:(sec.en||sec.sec)}</span>
      <span class="tg">${sec.tag||''}</span></div>`;
    sec.items.forEach(it=>{
      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = `
        ${thumb(it.key)}
        <div class="info">
          <div class="nm">${nameOf(it)}</div>
          <div class="sub">${it.g} ${it.u} · ${it.kcal} kcal · P${it.p} C${it.c} F${it.f}</div>
        </div>
        <div class="pr">${eur(it.pr)}</div>
        <div class="stepper">
          <button data-m="-1">\u2212</button><span class="q" data-q></span><button data-m="1">+</button>
        </div>`;
      const paint = ()=>{
        const q = unitQty(it.key);
        const el = row.querySelector('[data-q]');
        el.textContent = q || '0';
        el.classList.toggle('zero', !q);
        row.classList.toggle('active', !!q);
        /* la jauge suit le stepper d'un jus comme celui d'un bowl */
        updateGauges();
      };
      row.querySelectorAll('.stepper button').forEach(b=>{
        b.onclick = ()=>{ addUnit(it, +b.dataset.m); paint(); };
      });
      paint();
      w.appendChild(row);
    });
    units.push({sec, el:w});
  });

  /* L'ORDRE DE LA PAGE SUIT LE MOMENT DE LA JOURNEE. Au petit-dejeuner,
     avant l'effort ou sur un en-cas, on met devant les sections qui
     servent ce moment ; les signatures passent dessous. Partout
     ailleurs, les bowls ouvrent la carte. */
  const first = bowlFirst ? [] : (cx.secs || COMPL_SECS);
  units.filter(u=>first.indexOf(u.sec.sec) >= 0)
       .sort((a,b)=> first.indexOf(a.sec.sec) - first.indexOf(b.sec.sec))
       .forEach(u=>body.appendChild(u.el));
  /* COMPOSER PASSE DEVANT LES SIGNATURES. C'est la porte d'entree du
     systeme : on compose, les jauges suivent. Les signatures restent
     juste dessous pour qui veut un plat tout fait. */
  body.appendChild(cw);
  body.appendChild(sw);
  units.filter(u=>first.indexOf(u.sec.sec) < 0).forEach(u=>body.appendChild(u.el));
  renderJump();
  updateGauges();
}

/* ---------------------------------------------------------------------
   14 bis. LES RACCOURCIS
   La barre se construit en lisant l'ordre reel des sections dans la page,
   jamais une liste ecrite a part : une section qui remonte au
   petit-dejeuner remonte aussi dans la barre, sans code en plus.
   ------------------------------------------------------------------ */
const JUMP = {
  fr:{'BOWLS':'Bowls','BREAKFAST':'Petit-d\u00e9j','JUICES + SMOOTHIES':'Jus',
      'SHAKES + SNACKS':'Snacks','COFFEE':'Caf\u00e9'},
  en:{'BOWLS':'Bowls','BREAKFAST':'Breakfast','JUICES + SMOOTHIES':'Juices',
      'SHAKES + SNACKS':'Snacks','COFFEE':'Coffee'}
};
/* Hauteur de l'entete collante, mesuree et non devinee : elle depend de
   env(safe-area-inset-top), donc de l'appareil. */
function syncHdrVar(){
  const h = document.getElementById('hdr');
  if(h) document.documentElement.style.setProperty('--hdr', h.offsetHeight + 'px');
}
function jumpSections(){
  const b = document.getElementById('menuBody');
  return b ? [...b.children].filter(el=>el.dataset && el.dataset.jump) : [];
}
function jumpOffset(){
  const h = document.getElementById('hdr'), j = document.getElementById('menuJump');
  /* SC.top : la barre d'etat du telephone de demonstration. Dans le
     cadre, l'entete est collee a 50 px et non a 0. */
  return SC.top + (h?h.offsetHeight:52) + (j?j.offsetHeight:0);
}
function renderJump(){
  const bar = document.getElementById('menuJump');
  if(!bar) return;
  syncHdrVar();
  bar.innerHTML = '';
  const lbl = JUMP[LANG] || JUMP.en;
  jumpSections().forEach(sec=>{
    const b = document.createElement('button');
    b.textContent = lbl[sec.dataset.jump] || sec.dataset.jump;
    b.dataset.for = sec.id;
    b.onclick = ()=>{
      /* +1 px : sans lui, le titre de section se cale pile sous la barre
         et l'observateur de defilement hesite entre deux sections. */
      const y = contentTop(sec) - jumpOffset() + 1;
      SC.to({top:Math.max(0,y), behavior:'smooth'});
    };
    bar.appendChild(b);
  });
  spyJump();
}
/* Marque la section ou l'on se trouve, et ramene sa pastille dans le champ
   de vision quand la barre deborde en largeur. */
function spyJump(){
  const bar = document.getElementById('menuJump');
  if(!bar || !bar.children.length) return;
  const off = jumpOffset() + 6;
  const secs = jumpSections();
  let cur = secs[0];
  secs.forEach(s=>{ if(contentTop(s) - SC.y <= off) cur = s; });
  /* LA DERNIERE SECTION NE PEUT PAS ATTEINDRE LE HAUT : la page n'a plus de
     course. Mesure a 375x812 : CAFE s'arrete a 338 px du haut, donc la regle
     ci-dessus allumait encore SNACKS. En bas de page, c'est la derniere. */
  if(SC.y + SC.h >= SC.max - 2) cur = secs[secs.length-1];
  [...bar.children].forEach(b=>{
    const on = b.dataset.for === (cur && cur.id);
    if(on && !b.classList.contains('on') && bar.scrollWidth > bar.clientWidth){
      const l = b.offsetLeft - 16;
      if(l < bar.scrollLeft || b.offsetLeft + b.offsetWidth > bar.scrollLeft + bar.clientWidth)
        bar.scrollTo({left:Math.max(0,l), behavior:'smooth'});
    }
    b.classList.toggle('on', on);
  });
}
window.addEventListener('scroll', ()=>{ if(view === 'v-menu') spyJump(); },
                        {passive:true});
window.addEventListener('resize', ()=>{ syncHdrVar(); if(view === 'v-menu') spyJump(); });

/* ---------------------------------------------------------------------
   15. COMPOSER — jauges en direct
   ------------------------------------------------------------------ */
const GAUGES = [{k:'p',u:'g'},{k:'c',u:'g'},{k:'f',u:'g'},{k:'kcal',u:'kcal'}];

/* Un panneau de jauges, pose dans n'importe quel ecran. Trois existent :
   la carte, le composeur, le recapitulatif. Ils lisent tous le meme
   repas et sont peints par le meme code — une seule verite. */
function gaugePanel(hostId){
  const gw = document.getElementById(hostId);
  if(!gw) return;
  const wrap = gw.parentElement;
  if(!state.hasRatio){ wrap.style.display = 'none'; gw.innerHTML = ''; return; }
  wrap.style.display = '';
  gw.innerHTML = '';
  GAUGES.forEach(d=>{
    const el = document.createElement('div');
    el.className='gauge'; el.dataset.key=d.k;
    el.innerHTML = `<div class="g-top"><span class="g-name">${t('g.'+d.k)}</span>
      <span class="g-val" data-v></span></div>
      <div class="track"><span class="band" data-band></span>
      <span class="marker" data-mark></span></div>`;
    gw.appendChild(el);
  });
}

function renderBuild(){
  gaugePanel('gauges');
  const body = document.getElementById('buildBody');
  body.innerHTML = '';
  BOWL_SECS.forEach(sec=>{
    const w = document.createElement('div');
    w.className='sec';
    w.innerHTML = `<div class="sec-h"><span class="nm">${LANG==='fr'?sec.fr:(sec.en||sec.sec)}</span></div>`;
    sec.items.forEach(it=>{
      const row = document.createElement('div');
      row.className='item';
      const sup = it.sup ? `+${eur(it.sup)}` : '';
      row.innerHTML = `
        ${thumb(it.key)}
        <div class="info"><div class="nm">${nameOf(it)}</div><div class="sub" data-sub></div></div>
        <div class="pr" style="color:var(--muted);font-size:11px">${sup}</div>
        <div class="stepper">
          <button data-m="-1">\u2212</button><span class="q" data-q></span><button data-m="1">+</button>
        </div>`;
      const paint = ()=>{
        const q = state.qty[it.key] || 0;
        const qe = row.querySelector('[data-q]');
        qe.textContent = q ? (q.toFixed(1).replace('.0','') + '\u00d7') : '0';
        qe.classList.toggle('zero', !q);
        row.classList.toggle('active', !!q);
        row.querySelector('[data-sub]').textContent = q
          ? `${+(it.g*q).toFixed(1)} g · ${Math.round(it.kcal*q)} kcal · P${(it.p*q).toFixed(0)} C${(it.c*q).toFixed(0)} F${(it.f*q).toFixed(0)}`
          : `${it.g} g · ${it.kcal} kcal · P${it.p} C${it.c} F${it.f}`;
      };
      row.querySelectorAll('.stepper button').forEach(b=>{
        b.onclick = ()=>{
          const cur = state.qty[it.key] || 0;
          state.qty[it.key] = Math.min(3, Math.max(0,
            +(cur + (+b.dataset.m)*0.5).toFixed(1)));
          paint(); updateGauges(); syncBar();
        };
      });
      paint();
      w.appendChild(row);
    });
    body.appendChild(w);
  });
  updateGauges();
}

/* Le relais compact de la barre basse : quatre traits, aucun texte. */
function stripPanel(){
  const st = document.getElementById('gstrip');
  if(!st) return;
  if(!state.hasRatio){ st.style.display='none'; st.innerHTML=''; return; }
  st.style.display = '';
  if(st.children.length === GAUGES.length) return;   /* deja en place */
  st.innerHTML = GAUGES.map(d=>`<span class="gs" data-sk="${d.k}">
    <span class="gsb" data-sb></span><span class="gsm" data-sm></span></span>`).join('');
}

/* UNE SEULE FONCTION PEINT TOUT. Appelee a chaque modification du
   panier, d'ou qu'elle vienne : stepper d'un jus, ajout d'un bowl,
   retrait dans le recapitulatif. */
function updateGauges(){
  if(!state.hasRatio || !state.target) return;
  const cur = mealMacros();
  let on = 0, any = false;
  GAUGES.forEach(d=>{
    const [lo,hi] = state.target[d.k], v = cur[d.k];
    if(v>0) any = true;
    const max = hi*1.45, inR = v>=lo && v<=hi;
    if(inR) on++;
    const pos = Math.min(100, v/max*100);
    document.querySelectorAll(`.gauge[data-key="${d.k}"]`).forEach(el=>{
      el.querySelector('[data-v]').textContent =
        `${Math.round(v)} / ${lo}\u2013${hi} ${d.u}`;
      const b = el.querySelector('[data-band]');
      b.style.left = (lo/max*100)+'%'; b.style.width = ((hi-lo)/max*100)+'%';
      const m = el.querySelector('[data-mark]');
      m.style.left = pos+'%';
      m.classList.toggle('on', inR);
    });
    document.querySelectorAll(`.gs[data-sk="${d.k}"]`).forEach(el=>{
      const b = el.querySelector('[data-sb]');
      b.style.left = (lo/max*100)+'%'; b.style.width = ((hi-lo)/max*100)+'%';
      const m = el.querySelector('[data-sm]');
      m.style.left = pos+'%';
      m.classList.toggle('on', inR);
    });
  });
  const txt = !any ? (view==='v-build' ? t('build.begin') : t('g.empty'))
            : on===4 ? t('build.ontarget')
            : `${on} / 4 ${t('build.inrange')}`;
  ['status','statusMenu','statusOrder'].forEach(id=>{
    const s = document.getElementById(id);
    if(!s) return;
    s.textContent = txt;
    s.classList.toggle('on', any && on===4);
  });
}

/* ---------------------------------------------------------------------
   16. RECAPITULATIF ET CONFIRMATION
   ------------------------------------------------------------------ */
function lineSub(l){
  if(!l.macros) return '';
  const m = l.macros;
  return `${Math.round(m.kcal)} kcal · P${m.p.toFixed(0)} C${m.c.toFixed(0)} F${m.f.toFixed(0)}`;
}
function renderOrder(){
  const body = document.getElementById('orderBody');
  if(!state.cart.length){
    document.getElementById('gwrapOrder').style.display = 'none';
    body.innerHTML = `<div class="empty">${t('order.empty')}</div>
      <button class="btn ghost" id="oBack"><span>${t('bar.menu')}</span>
      <span class="ar">\u2192</span></button>`;
    body.querySelector('#oBack').onclick = ()=>show('v-menu');
    return;
  }
  /* Le dernier endroit ou l'on peut encore corriger le repas. */
  gaugePanel('gaugesOrder');
  body.innerHTML = '';
  state.cart.forEach((l, i)=>{
    const row = document.createElement('div');
    row.className = 'rline';
    /* LA PORTION DOIT APPARAITRE ICI : sans cette ligne, le comptoir lit
       "ROTI" et sert un bowl standard que le client a paye en base
       genereuse. La note est ce que la cuisine doit faire de different. */
    const note = l.note
      ? `<div class="rsub" style="color:var(--olive)">${l.note}</div>` : '';
    row.innerHTML = `<div style="flex:1">
        <div><span class="q">${l.qty}\u00d7</span>${l.label}</div>
        ${note}<div class="rsub">${lineSub(l)}</div></div>
      <div style="text-align:right">
        <b>${eur(l.price*l.qty)}</b>
        <div class="rsub" style="cursor:pointer;color:var(--warn)" data-del>
          ${LANG==='fr'?'Retirer':'Remove'}</div></div>`;
    row.querySelector('[data-del]').onclick = ()=>{
      state.cart.splice(i,1); renderOrder(); syncBar();
    };
    body.appendChild(row);
  });
  const tot = cartTotal();
  const tva = tot - tot/(1+TVA_FOOD);
  const f = document.createElement('div');
  f.innerHTML = `
    <div class="rtot"><span>${t('order.total')}</span><b>${eur(tot)}</b></div>
    <div class="rsub" style="margin-top:8px">${t('order.tva')} : ${eur(tva)}</div>
    <div style="margin-top:26px">
      <button class="btn" id="send"><span>${t('order.send')}</span>
      <span class="ar">\u2192</span></button></div>
    <p class="note">${t('order.note')}</p>`;
  f.querySelector('#send').onclick = sendOrder;
  body.appendChild(f);
}

function sendOrder(){
  const code = Array.from({length:4},()=>
    'ACDEFGHJKLMNPRTUVWXY34679'[Math.floor(Math.random()*25)]).join('');
  document.getElementById('doneCode').textContent = code;
  const b = document.getElementById('doneBody');
  b.innerHTML = state.cart.map(l=>
    `<div class="rline"><span><span class="q">${l.qty}\u00d7</span>${l.label}</span>
     <b>${eur(l.price*l.qty)}</b></div>`).join('') +
    `<div class="rtot"><span>${t('order.total')}</span><b>${eur(cartTotal())}</b></div>
     <div style="margin-top:28px"><button class="btn ghost" id="again">
     <span>${t('done.new')}</span><span class="ar">\u2192</span></button></div>`;
  b.querySelector('#again').onclick = ()=>{
    state.cart = []; state.qty = {}; HISTORY.length = 0; show('v-menu', false);
  };
  HISTORY.length = 0;
  show('v-done', false);
  document.getElementById('bottom').classList.remove('on');
}

/* ---------------------------------------------------------------------
   17. AMORCAGE
   ------------------------------------------------------------------ */
document.getElementById('e-order').onclick = ()=>show('v-menu');
document.getElementById('e-ratio').onclick = ()=>show('v-goal');

/* enchainement du tunnel de profilage : la barre basse sert de "suivant" */
function wireFlow(){
  const b = document.getElementById('flowNext');
  document.getElementById('flowLabel').textContent = LANG==='fr' ? 'Suivant' : 'Next';
  b.dataset.next = '1';
  b.onclick = ()=>{
    const i = FLOW.indexOf(view);
    if(i >= 0 && i < FLOW.length - 1) show(FLOW[i+1]);
  };
}

/* L'ordre compte : on restaure le profil AVANT de cabler les curseurs,
   sinon ils affichent les valeurs par defaut. */
const returning = load();

/* Tout ce qui touche au corps ou a la charge repeint les deux
   explications : elles portent des kcal, elles ne peuvent pas rester en
   retard d'un cran sur les curseurs. */
const reprofile = ()=>{ renderLoad(); renderDay(); };
bindSeg('sexSeg','sex', null, reprofile);
bindSeg('actSeg','act', parseFloat, reprofile);
bindSeg('daySeg','day', null, ()=>{ syncCtx(); renderDay(); });
bindRange('age','age','u.yrs', null, reprofile);
bindRange('height','height','u.cm', null, reprofile);
bindRange('weight','weight','u.kg', null, reprofile);
bindRange('hpw','hpw','u.hweek', fmtH, ()=>{
  /* des heures sans jour n'existent pas, et l'inverse non plus */
  if(state.hpw > 0 && state.days === 0) setDays(1);
  reprofile();
});
bindRange('days','days','u.dweek', null, ()=>{
  if(state.days === 0){ state.day = 'rest'; bindSeg('daySeg','day', null,
    ()=>{ syncCtx(); renderDay(); }); syncCtx(); }
  reprofile();
});
function setDays(n){
  state.days = n;
  const r = document.getElementById('days');
  r.value = n;
  document.getElementById('daysV').innerHTML = n + `<small>${t('u.dweek')}</small>`;
  save();
}

applyLang();
/* le cadre AVANT le premier ecran : sinon l'entete se mesure sans la
   barre d'etat et les raccourcis de la carte se collent 50 px trop haut */
fitFrame();
if(returning){ computeRatio(); show('v-menu', false); }
else { show('v-home', false); }

</script>
