<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#F2F0E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FORM — Food built around you.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F2F0E9; --paper:#FAF9F5; --ink:#1B1A17; --ink-soft:#4A473F;
  --muted:#9A948A; --line:#DFDBD1; --olive:#4E5A46; --warn:#8A5A3B;
  --pad:22px; --bar:74px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  background:var(--cream); color:var(--ink); font-weight:300;
  min-height:100dvh; font-size:15px; line-height:1.5;
}
#app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--cream);
  display:flex;flex-direction:column;position:relative}
@media(min-width:520px){
  body{background:#E7E4DB}
  #app{box-shadow:0 20px 60px -24px rgba(27,26,23,.26)}
}

/* ---------- le cadre de demonstration ----------
   DEUX ETATS, UN SEUL FICHIER.
   Sans .framed : le cadre est transparent, l'app occupe l'ecran, c'est
   le produit. Avec .framed (pose par JS quand la fenetre est assez
   grande) : l'app rentre dans un telephone de 390x810 pose sur un fond
   gris, c'est la demo. La classe est posee par JS et non par une media
   query parce que le code de defilement doit savoir dans quel etat il
   est : dans le cadre, le conteneur qui defile est #app, pas la fenetre.
   --top est la hauteur de la barre d'etat du telephone, 0 hors cadre.
   Tout ce qui est colle en haut (entete, raccourcis) s'y refere. */
.stage{display:contents}
.notch,.statusbar,.stage-caption{display:none}

body.framed{display:flex;align-items:center;justify-content:center;
  height:100vh;overflow:hidden;background:#E7E4DB}
body.framed .stage{display:flex;flex-direction:column;align-items:center;gap:24px;
  transform:scale(var(--s,1));transform-origin:center center}
body.framed .stage-caption{display:block;font-size:9px;letter-spacing:.34em;
  color:var(--muted);text-transform:uppercase}
body.framed .stage-caption sup{font-size:7px;vertical-align:super}
body.framed .device{width:390px;height:810px;background:var(--cream);
  border-radius:46px;position:relative;overflow:hidden;transition:background .5s ease;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,
             0 40px 80px -30px rgba(27,26,23,.38),
             0 0 0 9px #16150F,0 0 0 10px #2E2C25}
body.framed .notch{display:block;position:absolute;top:11px;left:50%;
  transform:translateX(-50%);width:108px;height:26px;background:#16150F;
  border-radius:14px;z-index:60}
/* ELLE DOIT ETRE OPAQUE. #app reserve 50 px de padding en haut pour cette
   barre, et l'entete colle a top:0, c'est-a-dire au bord du padding : donc
   a 50 px. La bande au-dessus n'appartient a personne, et tout ce qui
   defile y passait a decouvert — on lisait le plat suivant par-dessus
   l'entete. Le fond la ferme ; z-index 55 la met deja devant l'entete. */
body.framed .statusbar{display:flex;position:absolute;top:0;left:0;right:0;height:50px;
  align-items:center;justify-content:space-between;padding:0 30px;font-size:11px;
  letter-spacing:.04em;color:var(--ink);z-index:55;pointer-events:none;
  background:var(--cream);transition:color .5s ease,background .5s ease}
body.framed .statusbar .dots{display:flex;gap:3px;align-items:center}
body.framed .statusbar .dots i{width:3px;height:3px;border-radius:50%;
  background:currentColor;display:block}
body.framed{--top:50px}
body.framed #app{position:absolute;inset:0;max-width:none;min-height:0;
  height:100%;overflow-y:auto;padding-top:var(--top);box-shadow:none;
  scrollbar-width:none}
body.framed #app::-webkit-scrollbar{display:none}
/* l'ecran noir deborde jusque sous la barre d'etat, dont les icones
   passent en clair : c'est ce qui donne l'effet « l'app bascule ». */
body.framed.dark .device{background:var(--ink)}
body.framed.dark .statusbar{color:var(--paper);background:var(--ink)}

/* ---------- typographie de marque ---------- */
.eyebrow{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
.wordmark{font-size:15px;letter-spacing:.42em;font-weight:400}
h1{font-size:30px;font-weight:200;letter-spacing:-.01em;line-height:1.12}
h2{font-size:21px;font-weight:200;letter-spacing:-.005em}
.lede{color:var(--ink-soft);font-size:14px;margin-top:12px}
.brandline{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}

/* ---------- entete ---------- */
/* top:0 et pas top:50 dans le cadre. Pour un conteneur qui defile, le
   rectangle de contrainte d'un element colle est deja reduit du padding
   du conteneur : les 50 px de barre d'etat sont donc deja comptes. Les
   ajouter ici descendait l'entete de 50 px de plus et elle recouvrait le
   haut du contenu. Mesure : entete a 100 px, contenu a 102 px. */
header{position:sticky;top:0;z-index:40;background:rgba(242,240,233,.94);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 13px) var(--pad) 13px;
  display:flex;align-items:center;gap:12px;min-height:52px}
header .sp{flex:1}
.iconbtn{background:none;border:0;font:inherit;color:var(--ink);cursor:pointer;
  font-size:19px;line-height:1;padding:4px 6px;margin-left:-6px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;font:inherit;font-size:9px;letter-spacing:.18em;
  padding:6px 9px;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--ink);color:var(--cream)}
.prog{position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:transparent;opacity:0;transition:opacity .35s}
.prog.on{opacity:1}
.prog span{display:block;height:1px;width:0;background:var(--ink);
  transition:width .55s cubic-bezier(.22,.8,.26,1)}
body.dark .prog span{background:var(--paper)}

/* ---------- vues ---------- */
main{flex:1;display:flex;flex-direction:column}
.view{display:none;flex:1;flex-direction:column;padding:0 var(--pad)}
/* L'ENCHAINEMENT DE LA DEMO : chaque ecran apparait en fondu, et monte
   de 12 px quand il peut. Animation et non transition, parce qu'on passe
   de display:none a display:flex et qu'une transition ne se declenche
   pas sur ce saut.
   LE RELEVEMENT EST REFUSE A LA CARTE. Un transform sur un parent
   deplace aussi ce qui est colle a l'interieur : pendant l'animation,
   l'entete et la barre de raccourcis descendaient de 12 px avec elle.
   Mesure : raccourcis a 114 px au lieu de 102. La carte se contente
   donc du fondu, qui ne cree pas de bloc conteneur. */
.view.on{display:flex;animation:fade .42s ease}
#v-home.on,#v-goal.on,#v-body.on,#v-ctx.on,#v-ratio-out.on,#v-order.on,#v-done.on{
  animation:rise .42s cubic-bezier(.22,.8,.26,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){ .view.on{animation:none} }
.pad-b{padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom) + 28px)}

/* ---------- les ecrans noirs ----------
   Teinte posee sur <body> : elle descend sur la coque du telephone, la
   barre d'etat, l'entete et la barre basse d'un seul coup. Les styles
   en ligne d'avant ne touchaient que #app et laissaient le cadre creme
   autour d'un ecran noir, ce qui se voyait. */
/* hors cadre, la page entiere bascule ; dans le cadre, seule la coque du
   telephone bascule et le fond du bureau reste gris, sinon le telephone
   se dissout dans la page et on perd l'objet qu'on voulait montrer */
body.dark:not(.framed){background:var(--ink)}
body.dark #app{background:var(--ink);color:var(--paper)}
body.dark header{background:rgba(27,26,23,.94);color:var(--cream);
  border-bottom-color:rgba(242,240,233,.16)}
body.dark header .iconbtn{color:var(--cream)}
body.dark .lang{border-color:rgba(242,240,233,.22)}
body.dark .lang button{color:#8F8B81}
body.dark .lang button.on{background:var(--paper);color:var(--ink)}
body.dark .bottom{background:rgba(27,26,23,.95);border-top-color:rgba(242,240,233,.16)}
body.dark .bottom .btn{background:var(--paper);color:var(--ink)}
/* L'ACCUEIL EST UN SPLASH, PAS UNE PAGE. L'entete s'efface : plus de
   trait, plus de fond, plus de FORM en petit au-dessus du FORM en
   grand. Elle n'est pas supprimee pour autant, parce qu'elle porte le
   choix de la langue, et c'est precisement ici qu'on le fait. */
body.splash header{background:transparent;backdrop-filter:none;
  border-bottom-color:transparent}
body.splash header .wordmark{visibility:hidden}
body.splash .bottom{display:none}
/* Sur fond encre, les deux boutons s'inversent : le plein devient clair,
   le fantome garde un filet a peine visible. Sans cette inversion le
   bouton plein serait encre sur encre, donc invisible. */
body.dark .btn{background:var(--paper);color:var(--ink)}
body.dark .btn.ghost{background:none;color:var(--paper);
  border-color:rgba(242,240,233,.26)}
/* Titres et chapeau : ils n'ont pas de couleur propre, ils heritent de
   #app. Rien a redefinir ici. .rule non plus : c'est un intertitre a
   filet, deja regle pour le fond encre, et lui poser un fond peignait un
   bandeau gris derriere le texte. */
body.dark .lede{color:#9A948A}
/* la devanture dans le noir : un leger retrait de lumiere pour qu'elle
   ne brule pas l'ecran a cote d'un fond encre */
body.splash #v-home .shot{background:#16150F}
body.splash #v-home .shot img{filter:brightness(.92)}

/* ---------- accueil ---------- */
#v-home{justify-content:center;align-items:flex-start;gap:0;
  padding-top:64px;padding-bottom:56px}
#v-home .lockup{margin-bottom:auto}
/* LE LOCKUP EST LA PREMIERE CHOSE QU'ON VOIT, il en a la taille. Le
   chapeau qui vivait sous le titre a ete retire : c'est sa place qui
   paie cet agrandissement, la page ne s'allonge pas pour autant. */
#v-home .mark{font-size:36px;letter-spacing:.4em;font-weight:200;line-height:1}
#v-home .sig{font-size:11px;letter-spacing:.26em;margin-top:14px;color:var(--muted)}
#v-home h1{margin-top:34px}
.entries{width:100%;margin-top:44px;display:flex;flex-direction:column;gap:11px}
#v-home .entries{margin-top:30px}
/* la devanture : pleine largeur, elle sort des 22 px de gouttiere de la vue */
#v-home .shot{margin:30px calc(var(--pad) * -1) 0;background:#E7E4DB;
  overflow:hidden;position:relative}
/* height:auto est obligatoire : l'attribut height="681" de la balise est un
   indice de presentation qui, sinon, l'emporte sur aspect-ratio.
   LE RAPPORT EST CELUI DU FICHIER, 960x681, et pas un format choisi :
   des qu'on s'en ecarte, object-fit:cover recadre. En 16/10 la devanture
   perdait 12 % en haut et en bas, en 2/1 elle en perdait 30 % et
   l'enseigne FORM se trouvait coupee. Ici, rien n'est recadre. */
#v-home .shot img{display:block;width:100%;height:auto;aspect-ratio:960/681;
  object-fit:cover;object-position:50% 50%}
/* ECRANS COURTS. Sans ce bloc la photo repousse le second bouton sous la
   ligne de flottaison : mesure a 667 px de haut, bas du bouton a 738 px ;
   ici il remonte a ~600 px.
   La classe est posee par fitFrame et non par une media query, parce que
   dans le cadre de demonstration ce n'est pas la fenetre qui est courte,
   c'est l'ecran du telephone : 810 px moins 50 px de barre d'etat, soit
   760 px utiles, pendant que la fenetre, elle, en fait 980. */
body.tight #v-home{padding-top:24px;padding-bottom:18px}
body.tight #v-home h1{margin-top:18px}
body.tight #v-home .shot{margin-top:18px}
body.tight #v-home .entries{margin-top:18px}
body.short #v-home .mark{font-size:28px;letter-spacing:.36em}
body.short #v-home .sig{font-size:10px;margin-top:10px}
body.short #v-home h1{font-size:26px;margin-top:14px}
body.short #v-home .shot{margin-top:14px}
body.short #v-home .entries{margin-top:14px}

/* ---------- boutons ---------- */
.btn{display:flex;align-items:center;justify-content:space-between;width:100%;
  border:0;font:inherit;cursor:pointer;padding:19px 22px;border-radius:2px;
  background:var(--ink);color:var(--cream);text-align:left;
  font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.btn .ar{font-size:14px;letter-spacing:0;opacity:.6}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.ghost .ar{opacity:.4}
.btn:disabled{opacity:.34;cursor:default}
.btn.sm{padding:13px 16px;font-size:10px}

/* ---------- blocs de choix ---------- */
.step{padding:34px 0 10px}
.opts{margin-top:26px;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.opt{display:flex;align-items:center;gap:14px;padding:17px 2px;
  border-bottom:1px solid var(--line);cursor:pointer;transition:opacity .2s}
.opt .k{font-size:9px;letter-spacing:.2em;color:var(--muted);width:18px}
.opt .n{font-size:13px;letter-spacing:.12em;text-transform:uppercase;display:block}
.opt .ob{flex:1;min-width:0}
.opt .od{display:block;font-size:11.5px;color:var(--muted);margin-top:4px;
  line-height:1.4;letter-spacing:.01em;text-transform:none}
.opt .d{flex:1;text-align:right;font-size:12px;color:var(--muted)}
.opt .dot{width:7px;height:7px;border-radius:50%;border:1px solid var(--line);flex:none}
.opt.sel .dot{background:var(--olive);border-color:var(--olive)}
.opt.sel .n{font-weight:400}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;font:inherit;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:9px 14px;
  color:var(--ink-soft);cursor:pointer;transition:all .18s}
.chip.sel{background:var(--ink);color:var(--cream);border-color:var(--ink)}
/* Un moment indisponible SORT de la liste au lieu d'y rester en grise.
   Un jour de repos n'a pas d'avant ni d'apres l'effort : les afficher
   eteints laissait cinq pastilles pour trois choix reels. */
.chip.off{display:none}

/* ---------- raccourcis de la carte ----------
   Collante sous l'entete. --hdr est mesuree au demarrage : l'entete porte
   env(safe-area-inset-top), donc sa hauteur n'est pas la meme sur un
   iPhone a encoche et sur un navigateur de bureau. */
/* gap 5 et padding 10 : mesure a 375 px, les cinq boutons faisaient 397 px de
   large pour 375 de place, CAFE etait coupe. A ce reglage : 373 px, tout tient. */
.jump{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;
  margin:0 calc(var(--pad) * -1);padding:9px var(--pad) 10px;
  position:sticky;top:var(--hdr,52px);z-index:30;
  background:rgba(242,240,233,.95);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:0 0 auto;background:none;border:1px solid var(--line);
  border-radius:999px;font:inherit;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;padding:8px 10px;color:var(--ink-soft);
  cursor:pointer;transition:all .18s;white-space:nowrap}
.jump button.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.jump:empty{display:none}

.field{padding:19px 0;border-bottom:1px solid var(--line)}
.field-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:13px}
.field-label{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.field-val{font-size:25px;font-weight:200}
.field-val small{font-size:9px;letter-spacing:.2em;color:var(--muted);margin-left:5px}
input[type=range]{-webkit-appearance:none;width:100%;height:1px;background:var(--line);outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;
  border-radius:50%;background:var(--cream);border:1px solid var(--ink);cursor:pointer}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;
  background:var(--cream);border:1px solid var(--ink);cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{flex:1;background:none;border:0;font:inherit;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;padding:13px 4px;color:var(--ink-soft);cursor:pointer}
.seg button.sel{background:var(--ink);color:var(--cream)}
.why{font-size:12px;color:var(--ink-soft);margin-top:14px;line-height:1.55}

/* ---------- LE TUNNEL TIENT EN UNE PAGE ----------
   Budget mesure dans le telephone de demonstration : 810 px d'ecran, moins
   50 px de barre d'etat, moins 52 px d'entete, moins 76 px de barre
   « Suivant » = 632 px pour le formulaire. L'ecran du corps en demandait
   1157. Tout ce qui suit est du reglage d'espacement, pas de la coupe :
   aucune question n'est retiree, aucune graduation n'est perdue.

   CE QU'ON NE TOUCHE PAS : la hauteur des controles. Un segment reste a
   13 px de padding et un curseur garde sa zone de prise — on comprime les
   marges, jamais la cible du doigt. */
.flow .step{padding:12px 0 4px}
.flow h2{font-size:19px}
.flow .step + div{margin-top:8px}
/* 41 px : on reste au-dessus de la cible au doigt, on ne descend pas a 34 */
.flow .seg button{padding:12px 4px}

/* UNE QUESTION PAR LIGNE, ET NON PAR BLOC. Le libelle et sa valeur
   formaient une bande au-dessus du controle : trois etages par question,
   86 a 90 px piece. Mis cote a cote — libelle dans une colonne fixe a
   gauche, controle sur tout le reste — la question tombe a ~55 px. C'est
   la que se trouvait la place, pas dans les marges : aucune question
   n'est retiree, aucune graduation perdue, et la zone de prise du curseur
   ne bouge pas d'un pixel. */
.flow .field{display:flex;flex-wrap:wrap;align-items:center;gap:0 14px;padding:7px 0}
/* 69 px au lieu de 75 : largement au-dessus des 44 px d'une cible au doigt,
   et les cinq objectifs cessent de deborder de 8 px. */
.flow .opt{padding:14px 2px}
.flow .field-head{flex:none;width:118px;flex-direction:column;align-items:flex-start;
  gap:1px;margin-bottom:0}
.flow .field-val{font-size:19px}
/* L'unite se resserre pour que « 4 JOURS / SEMAINE » tienne sur une ligne.
   Sinon elle se brisait et laissait « SEMAINE » orphelin deux lignes plus
   bas, au milieu du vide. */
.flow .field-val small{font-size:8px;letter-spacing:.1em;margin-left:4px}
.flow .field > input[type=range],.flow .field > .seg{flex:1;min-width:0}

/* UN SEGMENT CONTIENT DES MOTS, PAS UNE PISTE. Mis a cote du libelle, les
   quatre niveaux d'activite se retrouvaient a l'etroit dans 200 px et
   devenaient illisibles. La regle est donc : ce qui se lit prend la
   largeur, ce qui se tire se met en ligne. Les trois segments gardent les
   deux etages — ils coutent 18 px chacun, c'est le prix de la lisibilite. */
.flow .field.stack{display:block}
.flow .field.stack .field-head{width:auto;flex-direction:row;align-items:baseline;
  justify-content:space-between;margin-bottom:6px}
/* Ce qui explique, compare ou se choisit a plusieurs passe SOUS la ligne,
   sur toute la largeur : coince dans la colonne de droite, les pastilles
   de moment se seraient repliees sur trois rangs au lieu de deux. */
.flow .field > .ticks,.flow .field > .why,
.flow .field > .daycmp,.flow .field > .chips{flex-basis:100%}
.flow .field > .chips{margin-top:9px}
/* Le cas le plus long dicte le reglage : quand on declare zero
   entrainement, l'explication passe a trois lignes et c'est elle, pas le
   cas courant, qui decide si l'ecran tient. */
.flow .why{font-size:11px;margin-top:6px;line-height:1.4}
.flow .ticks{margin-top:4px}
.flow .opts{margin-top:14px}
.flow .daycmp{margin-top:10px}
.flow .daycmp .dc{padding:9px 10px}
.flow .daycmp .dv{font-size:17px}

/* UN CRAN DE PLUS SOUS 700 PX (iPhone SE et compagnie). On commence par la
   barre elle-meme : a 84 px elle mangeait a elle seule 16 % de l'ecran.
   Amaigrie a ~60 px, elle rend 24 px au formulaire avant meme qu'on
   touche au contenu. Le reste est du rognage de marges ; les cibles au
   doigt restent au-dessus de 40 px. */
body.short .flowbar{padding:8px var(--pad) calc(8px + env(safe-area-inset-bottom))}
body.short .flowbar .btn{padding:14px 18px}
body.short .flow .step{padding:8px 0 2px}
body.short .flow h2{font-size:17px}
body.short .flow .step + div{margin-top:6px}
body.short .flow .field{padding:4px 0}
body.short .flow .field-val{font-size:17px}
body.short .flow .opt{padding:10px 2px}
body.short .flow .opts{margin-top:8px}
/* la marge de la liste des disciplines est posee en style en ligne dans le
   balisage : seul !important peut la reprendre ici */
body.short #sportList{margin-top:8px !important}
body.short .flow .seg button{padding:10px 4px}
body.short .flow .why{font-size:10.5px;line-height:1.35;margin-top:5px}
body.short .flow .daycmp{margin-top:8px}
body.short .flow .daycmp .dc{padding:7px 10px}
body.short .flow .field > .chips{margin-top:7px}
body.short .flow .chip,body.short #sportList .chip{padding:8px 12px}
.why b{font-weight:400;color:var(--ink)}
.ticks{display:flex;justify-content:space-between;margin-top:7px;
  font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
/* les deux journees cote a cote, et l'ecart nomme */
.daycmp{display:flex;gap:1px;margin-top:15px;background:var(--line)}
.daycmp .dc{flex:1;background:var(--cream);padding:12px 10px}
.daycmp .dc.sel{background:var(--ink);color:var(--cream)}
.daycmp .dk{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted)}
.daycmp .dc.sel .dk{color:rgba(242,240,233,.55)}
.daycmp .dv{font-size:19px;font-weight:200;margin-top:5px}
.daycmp .dv small{font-size:8.5px;letter-spacing:.18em;margin-left:4px;
  color:var(--muted)}
.daycmp .dc.sel .dv small{color:rgba(242,240,233,.5)}
.daygap{font-size:11px;color:var(--olive);letter-spacing:.04em;margin-top:11px}

/* ---------- ecran RATIO ---------- */
#v-ratio-out{background:var(--ink);color:var(--cream)}
#v-ratio-out .eyebrow,#v-ratio-out .field-label{color:rgba(242,240,233,.5)}
.kcal{font-size:46px;font-weight:200;letter-spacing:-.02em;margin:22px 0 4px}
.kcal small{display:block;font-size:9px;letter-spacing:.24em;color:rgba(242,240,233,.5);
  margin-top:9px;line-height:1.7}
.macros{display:flex;gap:1px;margin:28px 0 0;background:rgba(242,240,233,.14)}
.mcell{flex:1;background:var(--ink);padding:17px 10px;text-align:center}
.mk{font-size:9px;letter-spacing:.22em;color:rgba(242,240,233,.5)}
.mv{font-size:21px;font-weight:200;margin:7px 0 3px}
.mu{font-size:8px;letter-spacing:.2em;color:rgba(242,240,233,.38)}
.rule{font-size:13px;letter-spacing:.04em;margin-top:30px;padding-top:22px;
  border-top:1px solid rgba(242,240,233,.18)}
.wtext{font-size:12.5px;color:rgba(242,240,233,.66);margin-top:11px;line-height:1.6}

/* ---------- bandeau RATIO sur le menu ---------- */
.ratiobar{display:flex;align-items:center;gap:13px;padding:14px 0;
  border-bottom:1px solid var(--line);cursor:pointer}
.ratiobar .l{flex:1;min-width:0}
.ratiobar .t{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.ratiobar .v{font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.ratiobar .ed{font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--olive);flex:none}

/* ---------- menu ---------- */
/* ---------- LES VIGNETTES ----------
   CARREES, ET CARREES PARTOUT. Une carte qui melange des photos de
   proportions differentes se lit comme un catalogue ; le meme carre,
   repete, se lit comme une carte. object-fit:cover recadre au centre,
   donc une photo verticale ou panoramique entre sans se deformer : le
   dossier de photos n'a aucun format a respecter.
   Pas d'arrondi, pas d'ombre : la marque est au trait. */
.th{width:46px;height:46px;object-fit:cover;flex:none;display:block}
/* Sur un bowl signature, la vignette est posee en flottant plutot que
   dans une colonne : le titre et la phrase de caractere s'enroulent
   autour sans qu'aucun de ces blocs change de nature, et une carte sans
   photo garde exactement la mise en page d'avant. */
.bowl .th{float:left;width:78px;height:78px;margin:3px 15px 4px 0}
/* LE FLOTTANT S'ARRETE APRES LA DESCRIPTION. Laisse libre, la liste
   d'ingredients commencait a droite de la photo et sa suite repartait a
   l'extreme gauche, sous la photo : un bord gauche en escalier, illisible
   sur deux lignes. Tout ce qui suit la phrase de caractere degage donc la
   vignette et retrouve la marge — la carte garde un seul bord gauche. */
.bowl .ing ~ .ing, .bowl .compl, .bowl .mac, .bowl .acts{clear:both}

.sec{margin-top:34px}
.sec-h{display:flex;align-items:baseline;gap:10px;padding-bottom:11px;
  border-bottom:1px solid var(--ink)}
.sec-h .nm{font-size:11px;letter-spacing:.26em;text-transform:uppercase}
.sec-h .tg{font-size:9px;letter-spacing:.18em;color:var(--muted);margin-left:auto}

.bowl{border-bottom:1px solid var(--line);padding:19px 0;cursor:pointer;position:relative}
.bowl .top{display:flex;align-items:baseline;gap:10px}
.bowl .nm{font-size:16px;letter-spacing:.1em;text-transform:uppercase;font-weight:300}
.bowl .pr{margin-left:auto;font-size:15px;font-weight:300;white-space:nowrap}
.bowl .ing{font-size:12.5px;color:var(--ink-soft);margin-top:7px;line-height:1.5}
.bowl .mac{font-size:9.5px;letter-spacing:.14em;color:var(--muted);margin-top:9px}
.bowl .acts{display:flex;gap:8px;margin-top:14px;align-items:center}
.bowl .acts .btn{width:auto;flex:1}
/* la carte retenue se signale comme une ligne a l'unite : le nom reprend
   du corps, rien de plus. Un fond colore ici peindrait un pave sur la
   moitie de la carte. */
.bowl.active .nm{font-weight:400}
.fitbadge{display:inline-flex;align-items:center;gap:6px;font-size:8.5px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--olive);
  border:1px solid var(--olive);border-radius:999px;padding:4px 9px;margin-bottom:10px}
.fitbadge.part{color:var(--warn);border-color:var(--warn)}
/* le complement : une seconde ligne a servir, pas une option cachee */
.compl{display:flex;align-items:baseline;gap:8px;margin-top:10px;
  padding-top:9px;border-top:1px dashed var(--line)}
.compl .pl{font-size:13px;color:var(--olive);line-height:1}
.compl .cn{font-size:12.5px;color:var(--ink-soft)}
.compl .cw{margin-left:auto;font-size:8.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted)}

/* ---------- lignes a l'unite ---------- */
.item{display:flex;align-items:center;gap:12px;padding:14px 0;
  border-bottom:1px solid var(--line)}
.item .info{flex:1;min-width:0}
.item .nm{font-size:14px}
.item .sub{font-size:10.5px;color:var(--muted);margin-top:3px;letter-spacing:.02em}
.item.active .nm{font-weight:400}
.item .pr{font-size:13px;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:2px;flex:none}
.stepper button{width:32px;height:32px;border:1px solid var(--line);background:none;
  font:inherit;font-size:15px;color:var(--ink);cursor:pointer;border-radius:50%;
  display:flex;align-items:center;justify-content:center;padding:0}
.stepper .q{min-width:30px;text-align:center;font-size:12px}
.stepper .q.zero{color:var(--muted)}

/* ---------- jauges ---------- */
.gwrap{position:sticky;top:52px;z-index:30;background:var(--cream);
  padding:16px 0 14px;border-bottom:1px solid var(--line)}
.gauge{margin-bottom:11px}
.gauge:last-child{margin-bottom:0}
.g-top{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;margin-bottom:5px}
.g-name{color:var(--muted)}
.g-val{color:var(--ink-soft);letter-spacing:.06em}
.track{position:relative;height:3px;background:var(--line);border-radius:2px}
.band{position:absolute;top:0;height:3px;background:rgba(78,90,70,.34);border-radius:2px}
.marker{position:absolute;top:-4px;width:2px;height:11px;background:var(--ink);
  transition:left .22s ease}
.marker.on{background:var(--olive);width:3px}
.status{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);
  margin-top:13px}
.status.on{color:var(--olive)}
/* sur le menu et le recapitulatif, la jauge ne colle pas en haut :
   elle est au debut de la page et on la retrouve en remontant. */
.gwrap.flat{position:static;padding:18px 0 16px}
/* le relais compact de la barre basse */
.gstrip{display:flex;gap:5px;padding-bottom:10px}
.gstrip .gs{flex:1;position:relative;height:3px;background:var(--line);border-radius:2px}
.gstrip .gsb{position:absolute;top:0;height:3px;background:rgba(78,90,70,.34);
  border-radius:2px}
.gstrip .gsm{position:absolute;top:-3px;width:2px;height:9px;background:var(--ink);
  transition:left .22s ease}
.gstrip .gsm.on{background:var(--olive);width:3px}
.bottom .brow{display:flex;gap:12px;align-items:center}

/* ---------- barre basse ---------- */
/* Meme ancrage que la barre du panier, sans le total : au profilage il
   n'y a rien a chiffrer, seulement a avancer. */
.flowbar{position:sticky;bottom:0;z-index:35;background:rgba(242,240,233,.95);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));
  display:none}
.flowbar.on{display:block}
.bottom{position:sticky;bottom:0;z-index:35;background:rgba(242,240,233,.95);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));
  display:none}
.bottom.on{display:block}
.bottom .sum{flex:none;min-width:74px}
.bottom .sum .t{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.bottom .sum .v{font-size:17px;font-weight:300;margin-top:2px}
.bottom .btn{flex:1}

/* ---------- commande ---------- */
.code{font-size:52px;font-weight:200;letter-spacing:.16em;margin:18px 0 6px}
.rline{display:flex;justify-content:space-between;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--line);font-size:13.5px}
.rline .q{color:var(--muted);font-size:11px;margin-right:7px}
.rline b{font-weight:400}
.rsub{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
.rtot{display:flex;justify-content:space-between;padding:17px 0;
  border-bottom:1px solid var(--ink);font-size:16px}
.rtot b{font-weight:400}
.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:18px}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:56px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>

<!-- LE CADRE DE DEMONSTRATION. Repris de FORM_YOUR_RATIO.html : sur un
     grand ecran l'app s'affiche dans un telephone pose sur un fond gris,

      <!-- LES DEUX PORTES. Elles se traduisent, contrairement a FORM et a
           FOOD BUILT AROUND YOU qui restent en anglais dans les deux
           langues. La difference n'est pas un detail de gout : la
           signature et le nom sont des objets de marque, qu'on ne traduit
           pas plus qu'un logo ; ces deux-la sont des BOUTONS, c'est-a-dire
           de l'interface. Un bouton qu'on ne comprend pas ne se clique
           pas. « Trouve ta FORM » garde le mot de marque a l'interieur
           d'une phrase francaise, ce qui est exactement le bon dosage.
           Elles n'ont pas de sous-titre : deux verbes a l'imperatif n'ont
           rien a expliquer, et la ligne qui les glosait ne faisait que
           repeter le bouton. L'ordre, lui, n'est pas neutre — on decouvre
           son RATIO avant de commander, c'est le sens du systeme. -->
      <div class="entries">
        <button class="btn" id="e-ratio">
          <span data-t="home.ratio"></span><span class="ar">&#8594;</span>
        </button>
        <button class="btn ghost" id="e-order">
          <span data-t="home.order"></span><span class="ar">&#8594;</span>
        </button>
      </div>
    </section>

    <!-- PROFILAGE : OBJECTIF + SPORT -->
    <section class="view flow" id="v-goal">
      <div class="step">
        <span class="eyebrow" data-t="goal.step"></span>
        <h2 data-t="goal.h"></h2>
      </div>
      <div class="opts" id="goalList"></div>
      <div class="step">
        <span class="eyebrow" data-t="goal.sport"></span>
        <div class="chips" id="sportList" style="margin-top:14px"></div>
      </div>
    </section>

    <!-- PROFILAGE : CORPS -->
    <section class="view flow" id="v-body">
      <div class="step">
        <span class="eyebrow" data-t="body.step"></span>
        <h2 data-t="body.h"></h2>
      </div>
      <div style="margin-top:20px">
        <div class="field stack">
          <div class="field-head"><span class="field-label" data-t="body.sex"></span></div>
          <div class="seg" id="sexSeg">
            <button data-v="f" data-t="body.f"></button><button data-v="m" data-t="body.m"></button>
          </div>
        </div>
        <div class="field">
          <div class="field-head"><span class="field-label" data-t="body.age"></span>
            <span class="field-val" id="ageV"></span></div>
          <input type="range" id="age" min="16" max="75" value="22">
        </div>
        <div class="field">
          <div class="field-head"><span class="field-label" data-t="body.height"></span>
            <span class="field-val" id="heightV"></span></div>
          <input type="range" id="height" min="140" max="210" value="165">
        </div>
        <div class="field">
          <div class="field-head"><span class="field-label" data-t="body.weight"></span>
            <span class="field-val" id="weightV"></span></div>
          <input type="range" id="weight" min="40" max="140" value="58">
        </div>
        <div class="field stack">
          <div class="field-head"><span class="field-label" data-t="body.act"></span></div>
          <div class="seg" id="actSeg">
            <!-- echelle NEAT seule : voir le commentaire de computeRatio -->
            <button data-v="1.2" data-t="body.a1"></button>
            <button data-v="1.3" data-t="body.a2"></button>
            <button data-v="1.4" data-t="body.a3"></button>
            <button data-v="1.5" data-t="body.a4"></button>
          </div>
        </div>
        <!-- L'ENTRAINEMENT SE MESURE EN HEURES, PAS EN SEANCES. Deux
             curseurs, parce que 5 h en 5 jours et 5 h en 2 jours sont
             deux vies differentes. -->
        <div class="field">
          <div class="field-head"><span class="field-label" data-t="body.hpw"></span>
            <span class="field-val" id="hpwV"></span></div>
          <input type="range" id="hpw" min="0" max="20" step="0.5" value="5">
          <div class="ticks"><span data-t="body.hpw.lo"></span>
            <span data-t="body.hpw.hi"></span></div>
        </div>
        <div class="field">
          <div class="field-head"><span class="field-label" data-t="body.days"></span>
            <span class="field-val" id="daysV"></span></div>
          <input type="range" id="days" min="0" max="7" value="4">
          <p class="why" id="loadWhy"></p>
        </div>
      </div>
    </section>

function load(){
  try{

    if(!raw) return false;
    const o = JSON.parse(raw);
    if(o.lang) LANG = o.lang;
    Object.keys(o).forEach(k=>{ if(k!=='lang' && k in state) state[k]=o[k]; });

       porte 1,375 / 1,55 / 1,725, valeurs qui ne correspondent plus a
       aucun bouton. On les ramene sur l'echelle NEAT. */
    const LEGACY_ACT = {1.375:1.3, 1.55:1.4, 1.725:1.5};
    if(LEGACY_ACT[state.act]) state.act = LEGACY_ACT[state.act];
    /* Un profil enregistre avant le passage aux heures ne porte qu'un
       nombre de seances. Une seance = une heure, faute de mieux : c'est
       une reprise de profil, pas une mesure. */
    if(typeof o.freq === 'number' && typeof o.hpw !== 'number'){
      state.days = Math.min(7, o.freq);
      state.hpw  = Math.min(7, o.freq);
    }
    /* LEAN couvrait secher ET perdre du poids. Les anciens profils
       restent sur LEAN, qui existe toujours : rien a migrer. Mais un
       objectif supprime d'une future version doit retomber sur un
       objectif valide, sinon GOALS.find renvoie undefined. */
    if(!GOALS.some(g=>g.id===state.goal)) state.goal = DEFAULTS.goal;

}

/* ---------------------------------------------------------------------
   6. LE CALCUL DU RATIO
   Strictement identique a FORM_YOUR_RATIO.html. Toute modification
   ici doit etre repercutee dans la demo, et inversement.
   Produit des FOURCHETTES, jamais un nombre unique : c'est la regle
   de marque, et c'est aussi la verite physiologique.
   ------------------------------------------------------------------ */
/* COMBIEN COUTE UNE HEURE D'ENTRAINEMENT, EN KCAL.
   Une seance moderee a vigoureuse vaut environ 7 METs. La depense
   brute vaut MET x 3,5 x kg / 200 kcal par minute, soit MET x 1,05 x kg
   par heure. On retire 1 MET : l'heure passee a s'entrainer serait de
   toute facon une heure de metabolisme de base, et celui-la est deja
   compte. C'est le cout NET, le seul qu'on ait le droit d'ajouter.
   EPOC : la consommation reste elevee quelques heures apres l'effort,
   generalement sous 10 % du cout de la seance. Petit, mais reel. */
const MET_TRAIN = 7;
const EPOC = 0.08;
/* Bornes, en g/kg. Le plancher de gras protege le systeme hormonal ;
   le plancher de glucides evite qu'un jour de repos en deficit ne vide
   completement le poste ; le plafond de glucides est le haut de la
   fourchette ACSM, reserve a l'endurance de 1 a 3 h par jour. */
const FAT_MIN = 0.6;
const CARB_MIN = 2.0, CARB_MAX = 7.0;

/* Le bilan energetique du profil, jour par jour. Separe de computeRatio
   parce que l'ecran de profilage en affiche les deux colonnes : c'est
   la reponse a "est-ce qu'on consomme autant un jour de repos ?". */
function energy(){
  const {sex, age, height, weight, act, hpw, days} = state;
  /* Mifflin-St Jeor. ATTENTION au piege : l'echelle classique
     1,2 / 1,375 / 1,55 / 1,725 INCLUT DEJA le sport. Ici le curseur
     d'activite ne porte que sur la vie hors entrainement (NEAT), et
     l'entrainement est compte a part, en kcal mesurees. L'echelle est
     donc rebasee a 1,2 / 1,3 / 1,4 / 1,5. */
  const bmr  = 10*weight + 6.25*height - 5*age + (sex==='m' ? 5 : -161);
  const neat = bmr * act;
  const perHour = (MET_TRAIN - 1) * 1.05 * weight * (1 + EPOC);
  const week    = hpw * perHour;
  const session = days > 0 ? week / days : 0;
  return {bmr, neat, perHour, week, session,
          training: neat + session,   /* un jour ou l'on s'entraine */
          rest:     neat,             /* un jour ou l'on ne s'entraine pas */
          avg:      neat + week / 7};
}

function computeRatio(){
  const {weight, goal, day, ctx} = state;
  const g = GOALS.find(x=>x.id===goal) || GOALS[0];
  const e = energy();

  /* LA DIFFERENCE ENTRE LES DEUX JOURS N'EST PLUS UN COEFFICIENT, C'EST
     UNE MESURE. Le metabolisme de base ne bouge pas d'un jour a l'autre
     — c'est le meme corps. Ce qui bouge, c'est le cout de la seance, et
     lui seul. L'ancienne version appliquait x1,05 et x0,93, soit un
     ecart de 13 % quelle que soit la seance : faux pour 20 minutes de
     pilates comme pour deux heures de course. */
  const training = day === 'training';
  const kcal = (training ? e.training : e.rest) * g.kcal;

  /* LES PROTEINES NE BAISSENT PAS LE JOUR DU REPOS. La synthese
     proteique reste elevee 24 a 48 h apres une seance de force : la
     reconstruction se fait justement les jours de repos.
     LES LIPIDES NON PLUS : ils ne sont pas un carburant d'effort.
     LES GLUCIDES, SI — et la baisse n'est pas un coefficient qu'on a
     choisi, c'est ce qui reste quand on retire le cout de la seance.
     Rien n'est multiplie par 0,85 ici : la baisse est deduite. */
  let P = weight * g.protein;
  let F = weight * g.fat;
  let C = (kcal - P*4 - F*9) / 4;

  const cLo = weight * CARB_MIN, cHi = weight * CARB_MAX;
  if(C < cLo){
    /* jour de repos en deficit : plutot que de vider les glucides, on
       reprend sur le gras, jusqu'a son plancher. */
    C = cLo;
    F = Math.max(weight * FAT_MIN, (kcal - P*4 - C*4) / 9);
  } else if(C > cHi){
    C = cHi;
    F = (kcal - P*4 - C*4) / 9;
  }

  const c = CONTEXTS[ctx] || CONTEXTS['REGULAR MEAL'];
  const mP = P * c.share * c.p;
  const mC = C * c.share * c.c;
  const mF = F * c.share * c.f;
  const mKcal = mP*4 + mC*4 + mF*9;

  /* UNE TOLERANCE EN POURCENTAGE SEUL DEVIENT ABSURDE SUR UNE PETITE
     CIBLE. Les pourcentages ci-dessous sont cales sur un repas complet :
     +/-4 % de 1 000 kcal, c'est +/-40 kcal, raisonnable. Appliques a un
     en-cas de 140 kcal ils exigent +/-6 kcal, et a ses 10 g de proteines
     +/-0,7 g : plus une exigence d'arrondi qu'une exigence
     nutritionnelle. D'ou un PLANCHER, cale sur la resolution reelle
     d'une portion en cuisine.
     LES PLANCHERS SONT VOLONTAIREMENT BAS. Une premiere version les
     avait poses a 25 kcal / 4 / 6 / 3 g : mesure faite, ils mordaient
     sur 20 cas sur 22, repas complets compris. Ce n'etait plus un
     plancher, c'etait le remplacement de la calibration des repas par
     une tolerance plate — et l'accord moyen montait a 3,48/4 pour cette
     seule raison. Aux valeurs actuelles le plancher ne mord que sur
     l'en-cas et l'avant-effort, et l'accord d'un bowl nu est inchange au
     centieme (1,02/4) : preuve que les repas ne sont pas touches.
     Si vous elargissez ces planchers, verifiez cette valeur. */
  const MIN_K = 12, MIN_P = 1.5, MIN_C = 2, MIN_F = 1;
  const half  = (v,pct,fl)=>Math.max(v*pct, fl);
  const band  = (v,pct,fl)=>{ const h = half(v,pct,fl);
    return [Math.round((v-h)/5)*5, Math.round((v+h)/5)*5]; };
  const bandG = (v,pct,fl)=>{ const h = half(v,pct,fl);
    return [Math.max(0, Math.round(v-h)), Math.round(v+h)]; };

  state.target = {
    kcal: band(mKcal,.04,MIN_K), p: bandG(mP,.07,MIN_P),
    c: bandG(mC,.09,MIN_C),      f: bandG(mF,.11,MIN_F)
  };
  return state.target;
}

/* ---------------------------------------------------------------------
   7. MACROS ET ACCORD
   ------------------------------------------------------------------ */
function macrosOf(components){
  const o = {kcal:0,p:0,c:0,f:0};
  components.forEach(([key,q])=>{
    const it = ITEM[key];
    if(!it || !q) return;
    o.kcal += it.kcal*q; o.p += it.p*q; o.c += it.c*q; o.f += it.f*q;
  });
  return o;
}
function qtyToComponents(qty){
  return Object.keys(qty).filter(k=>qty[k]>0).map(k=>[k,qty[k]]);
}
const KEYS = ['p','c','f','kcal'];

/* Nombre de fourchettes respectees, puis ecart moyen pour trancher. */
function fit(macros){
  if(!state.target) return null;
  let inRange = 0, dist = 0;
  KEYS.forEach(k=>{
    const [lo,hi] = state.target[k], v = macros[k];
    if(v>=lo && v<=hi) inRange++;
    else dist += (v<lo ? (lo-v) : (v-hi)) / Math.max(1,hi);
  });
  return {inRange, dist};
}

/* Prix d'un bowl compose : forfait + supplements + proteines en plus. */
function priceCustom(components){
  let total = BOWL_PRICE, proteins = 0;
  components.forEach(([key,q])=>{
    const it = ITEM[key];
    if(!it || !q) return;
    if(it.sec === 'PROTEIN') proteins += q;
    total += (it.sup || 0) * q;
  });
  if(proteins > 1) total += (proteins - 1) * EXTRA_PROTEIN;
  return total;
}
const eur = v => v.toFixed(2).replace('.', ',') + ' \u20ac';
const nameOf = it => (LANG==='fr' && it.fr) ? it.fr : it.n;

   Le nom de fichier se deduit de la cle de l'article, en minuscules et
   sans accent : 'PROTEIN/Chicken' -> protein-chicken.jpg, le bowl ROTI
   -> bowl-roti.jpg. Voir photos/LISEZ-MOI.md pour la liste complete.
   ------------------------------------------------------------------ */
const PHOTO_DIR = 'photos/', PHOTO_EXT = '.jpg';
const slug = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const photoName = key => slug(key) + PHOTO_EXT;
/* alt vide et volontaire : la vignette ne porte aucune information que le
   nom du plat, juste a cote, ne donne deja. La doubler ferait repeter
   chaque ligne par un lecteur d'ecran. */
const thumb = (key, cls) => `<img class="th${cls ? ' '+cls : ''}" alt=""`
  + ` src="${PHOTO_DIR}${photoName(key)}" loading="lazy" onerror="this.remove()">`;

/* ---------------------------------------------------------------------
   7bis. ASSEMBLAGE DU REPAS
   Un bowl fixe ne peut pas tomber dans les fourchettes de tout le monde :
   les cibles d'un repas vont de 300 a 950 kcal selon le profil, alors
   qu'un bowl pese 480 a 610 kcal. Mesure faite sur 16 profils : 1 seul
   atteignait 4/4. L'app ne propose donc plus un bowl mais un REPAS, en
   jouant sur deux leviers et deux seulement :
     1. la PORTION — meme bacs, meme mise en place, servie plus ou moins
        genereusement. Zero recette nouvelle, zero seconde a la prepa.
     2. le COMPLEMENT — un shake, un snack ou un jus a cote, quand le
        bowl seul ne peut pas combler l'ecart.
   Un profil de 78 kg en PERFORM demande 115 g de glucides sur un repas,
   soit trois portions d'epeautre : aucun calibrage ne rend cela tenable
   dans un seul bol. Le complement n'est pas un rattrapage, c'est
   l'architecture — et il porte le ticket de 13,90 a ~19 EUR avec une
   raison que le client comprend.
   ------------------------------------------------------------------ */
/* Les multiplicateurs restent des multiples de 0,5 : c'est le pas du
   composeur, donc "Ajuster" repart exactement sur la portion servie. */
const BASE_SIZES = [          /* M en premier : c'est le bowl par defaut */
  {id:'M', m:1.0, pr:0,     fr:null,                   en:null},
  {id:'S', m:0.5, pr:-1.00, fr:'base l\u00e9g\u00e8re',  en:'light base'},
  {id:'L', m:1.5, pr:1.50,  fr:'base g\u00e9n\u00e9reuse',en:'generous base'}

  {m:2, pr:EXTRA_PROTEIN, fr:'double prot\u00e9ine', en:'double protein'}

/* Ce qu'on peut servir a cote sans rien cuisiner. Ni cafe ni
   petit-dejeuner : hors service du midi. */
const COMPL_SECS = ['SHAKES + SNACKS','JUICES + SMOOTHIES'];
const COMPLEMENTS = [];
MENU.filter(s=>COMPL_SECS.indexOf(s.sec)>=0)
    .forEach(s=>s.items.forEach(it=>COMPLEMENTS.push(it)));

const r2 = v => Math.round(v*100)/100;
/* snap sur le pas de 0,5 du composeur, plafonne a 3 comme lui */
const grid = v => Math.min(3, Math.max(0.5, Math.round(v*2)/2));

/* Une variante de portion, exprimee en composants de la carte. */
function variantOf(sig, bs, px, sx){
  const comps = sig.c.map(([k,q])=>{
    const sec = ITEM[k].sec;
    if(sec === 'CARBS')         return [k, grid(q*bs.m)];
    if(sec === 'PROTEIN')       return [k, grid(q*px.m)];
    if(sec === 'FATS + SAUCES') return [k, grid(q*sx.m)];
    return [k, q];
  });
  const bits = [bs, px, sx].filter(x=>x[LANG]).map(x=>x[LANG]);
  return {comps, price: r2(sig.price + bs.pr + px.pr + sx.pr), bits};
}

/* Compare deux assemblages : plus de fourchettes tenues, puis plus
   proche, puis moins cher. A accord egal on ne fait jamais payer plus. */
function better(o, best){
  if(!best) return true;
  if(!o.fit) return false;
  const d = o.fit.inRange - best.fit.inRange;
  const e = best.fit.dist - o.fit.dist;
  return d > 0 || (d === 0 && (e > 1e-9 ||
         (Math.abs(e) <= 1e-9 && o.price < best.price)));
}

/* DEUX TEMPS, ET LE SECOND EST UNE DECISION COMMERCIALE.
   1. la meilleure PORTION SEULE. Elle ne coute presque rien a produire,
      c'est donc toujours la premiere reponse. Son score sert de seuil.
   2. la meilleure combinaison PORTION + COMPLEMENT, retenue seulement
      si elle fait GAGNER UNE FOURCHETTE ENTIERE par rapport a ce seuil.
   Sans cette regle, le moteur ajoutait un smoothie a 6,50 EUR pour
   grappiller quelques kcal : un repas a 25,90 EUR qu'aucun client ne
   commande, et une app qui a l'air de vouloir vendre. L'euro depense
   doit avoir une raison que le client peut lire.
   On refait la recherche de portion au second temps plutot que de figer
   celle du premier : la portion qui va avec un shake n'est pas la meme
   que la portion servie seule.
   Sans RATIO, fit() rend null : on retombe sur le bowl nu de la carte,
   l'ordre de BASE_SIZES garantissant que M est teste en premier. */
function bestAssembly(sig){
  const variants = [];
  BASE_SIZES.forEach(bs=>PROT_X.forEach(px=>SAUCE_X.forEach(sx=>{
    variants.push(variantOf(sig, bs, px, sx));
  })));

  let best = null;
  variants.forEach(v=>{
    const o = {sig, v, bits:v.bits.slice(), compl:null,
               macros: macrosOf(v.comps), price: v.price};
    o.fit = fit(o.macros);
    if(better(o, best)) best = o;
  });
  if(!state.hasRatio || !best.fit || best.fit.inRange === 4) return best;

  const floor = best.fit.inRange;
  let withCp = null;
  variants.forEach(v=>{
    const m = macrosOf(v.comps);
    COMPLEMENTS.forEach(cp=>{
      const tot = {kcal:m.kcal+cp.kcal, p:m.p+cp.p, c:m.c+cp.c, f:m.f+cp.f};
      const o = {sig, v, bits:v.bits.slice(), compl:cp, macros:tot,
                 price: r2(v.price + cp.pr), fit:fit(tot)};
      if(o.fit.inRange > floor && better(o, withCp)) withCp = o;
    });
  });
  return withCp || best;
}

/* UN PETIT-DEJEUNER N'EST PAS UN BOWL, ET MERITE LE MEME TRAVAIL.
   Aux moments ou le bowl n'est pas la reponse — petit-dejeuner, en-cas,
   avant l'effort — on cherche l'assemblage parmi les articles a l'unite
   du moment : un seul article, ou une paire. La paire est la reponse
   normale : c'est ce qu'un client prend reellement, un plat et une
   boisson.
   LE TROISIEME ARTICLE EST SOUS CONDITION, JAMAIS PAR DEFAUT. Un
   gabarit lourd avant l'effort — 92 kg, prise de masse, cible a
   640 kcal — depasse ce que deux articles de la carte peuvent porter :
   le moteur rendait 1/4 et n'avait rien de mieux a proposer. On ouvre
   donc la recherche a trois articles, mais seulement quand la meilleure
   paire reste SOUS 3/4, et on ne retient un trio que s'il fait GAGNER
   UNE FOURCHETTE ENTIERE sur cette paire. Meme regle commerciale que le
   complement du bowl : jamais un article de plus pour grappiller
   quelques kcal. */
function unitsFor(ctxKey){
  const c = CONTEXTS[ctxKey];
  const secs = (c && c.secs) || COMPL_SECS;
  const out = [];
  MENU.filter(s=>s.unit && secs.indexOf(s.sec) >= 0)
      .forEach(s=>s.items.forEach(it=>out.push(it)));
  return out;
}
const sumMac = arr => arr.reduce((o,it)=>({
  kcal:o.kcal+it.kcal, p:o.p+it.p, c:o.c+it.c, f:o.f+it.f}), {kcal:0,p:0,c:0,f:0});

/* ON NE COMMANDE PAS DEUX FOIS LA MEME FORME. Sans cette regle, le
   moteur a propose "Barre proteinee + Flat white + Flat white avoine"
   (deux cafes au lait), "Bowl yaourt grec + Overnight oats + Bowl acai"
   (trois bols a 22,30 EUR) et trois jus a 18,30 EUR en en-cas : des
   additions que l'accord nutritionnel justifie et qu'aucun client ne
   passe.
   LE FILTRE PORTE SUR LA FORME SERVIE (ff), PAS SUR LA SECTION DE LA
   CARTE. Mesure sur 20 cas : filtrer par section corrigeait bien les
   trois absurdites, mais interdisait du meme coup "Overnight oats +
   Banana bread + Jus d'agrumes" — un bol, une patisserie, un jus,
   exactement le petit-dejeuner demande — parce que la section
   PETIT-DEJEUNER melange des bols, des plats chauds et une patisserie.
   La forme servie separe ce que la section confond. */
const sameForm = (a,b) => a.ff && b.ff && a.ff === b.ff;

function bestUnitCombos(ctxKey, n){
  const pool = unitsFor(ctxKey);
  const combos = [];
  pool.forEach((a,i)=>{
    combos.push([a]);
    /* le cafe noir ne porte aucune macro : en paire il n'apporte rien
       a l'accord, il ne ferait qu'alourdir la liste */
    for(let j=i+1; j<pool.length; j++){
      const b = pool[j];
      if(a.kcal < 20 || b.kcal < 20) continue;
      if(sameForm(a,b)) continue;
      combos.push([a,b]);
    }
  });
  const score = items => {
    const macros = sumMac(items);
    return {items, macros, price: r2(items.reduce((s,it)=>s+it.pr, 0)),
            fit: fit(macros)};
  };
  const byFit = (x,y)=> y.fit.inRange - x.fit.inRange
                     || x.fit.dist - y.fit.dist
                     || x.price - y.price;
  const scored = combos.map(score);
  scored.sort(byFit);

  /* LE TROISIEME ARTICLE : porte fermee tant que la paire tient 3/4, et
     fermee de toute facon sur un en-cas. Un en-cas a trois articles
     n'est plus un en-cas — c'est un repas vendu sous un faux nom. Seuls
     les moments qui pesent au moins 15 % de la journee y ont droit. */
  const floor = scored.length ? scored[0].fit.inRange : 0;
  const cx = CONTEXTS[ctxKey];
  if(floor < 3 && cx && cx.share >= 0.15){
    const solid = pool.filter(it=>it.kcal >= 20);
    const trios = [];
    for(let i=0; i<solid.length; i++)
      for(let j=i+1; j<solid.length; j++){
        if(sameForm(solid[i], solid[j])) continue;
        for(let k=j+1; k<solid.length; k++){
          if(sameForm(solid[k], solid[i]) || sameForm(solid[k], solid[j])) continue;
          const o = score([solid[i], solid[j], solid[k]]);
          /* une fourchette entiere de mieux, sinon on ne la montre pas */
          if(o.fit.inRange > floor) trios.push(o);
        }
      }
    if(trios.length){
      trios.sort(byFit);
      scored.unshift(...trios);
    }
  }
  /* on ne montre pas deux fois la meme idee : un article ne revient pas
     en tete de deux propositions voisines */
  const out = [], seen = {};
  scored.forEach(s=>{
    if(out.length >= n) return;
    const lead = s.items[0].key;
    if(seen[lead]) return;
    seen[lead] = 1; out.push(s);
  });
  return out;
}

/* Le badge ne dit plus "2/4" : un client ne sait pas quoi en faire. */
function fitLabel(ft){
  if(!ft) return null;
  if(ft.inRange === 4) return {k:'menu.fit.in',   cls:''};
  if(ft.inRange === 3) return {k:'menu.fit.near', cls:''};
  return {k:'menu.fit.part', cls:'part'};
}

/* ---------------------------------------------------------------------
   7ter. LA JAUGE MESURE LE REPAS, PAS LE BOWL
   Le panier EST le repas. Un jus plus une patisserie proteinee doivent
   deplacer la jauge exactement comme un bowl : sans cela, la moitie de
   la carte serait hors du systeme YOUR RATIO, et la promesse de marque
   ne tiendrait que sur les bowls.
   Dans le composeur, le brouillon en cours s'ajoute au panier : on voit
   l'effet de l'ingredient qu'on est en train d'ajouter.
   ------------------------------------------------------------------ */
function mealMacros(){
  const o = {kcal:0,p:0,c:0,f:0};
  state.cart.forEach(l=>{
    if(!l.macros) return;
    o.kcal += l.macros.kcal*l.qty; o.p += l.macros.p*l.qty;
    o.c    += l.macros.c*l.qty;    o.f += l.macros.f*l.qty;
  });
  if(view === 'v-build'){
    const d = macrosOf(qtyToComponents(state.qty));
    o.kcal += d.kcal; o.p += d.p; o.c += d.c; o.f += d.f;
  }
  return o;
}

/* ---------------------------------------------------------------------
   8. PANIER
   ------------------------------------------------------------------ */
function cartTotal(){ return state.cart.reduce((s,l)=>s + l.price*l.qty, 0); }
function cartCount(){ return state.cart.reduce((s,l)=>s + l.qty, 0); }
function addUnit(it, delta){
  const l = state.cart.find(x=>x.item===it.key);
  if(l){
    l.qty += delta;
    if(l.qty <= 0) state.cart.splice(state.cart.indexOf(l),1);
  } else if(delta > 0){
    state.cart.push({item:it.key, label:nameOf(it), price:it.pr, qty:1,
                     macros:{kcal:it.kcal,p:it.p,c:it.c,f:it.f}});
  }
  syncBar();
}
function unitQty(key){ const l = state.cart.find(x=>x.item===key); return l ? l.qty : 0; }

/* UNE SIGNATURE SE COMPTE COMME UN JUS. Le panier savait deja empiler,
   mais la carte n'offrait qu'un bouton AJOUTER qui partait aussitot vers
   la commande : il n'y avait nulle part ou dire « deux ».

   LA CLE EST LA SIGNATURE *ET* SA PORTION. L'ancien ajout ne fusionnait que
   les lignes non personnalisees ; or sur la carte un bowl est presque toujours
   dimensionne pour le ratio, donc marque custom, et deux clics sur AJOUTER
   fabriquaient deux lignes identiques au lieu d'une ligne a deux. En
   comparant aussi la portion, deux POWER tailles pareil s'empilent, tandis
   qu'un POWER retaille dans l'ecran de composition reste a part : ce sont
   deux recettes differentes, les fondre sous une seule quantite mentirait
   au comptoir. */
function sigLine(id, note){
  return state.cart.find(l => l.sig === id && (l.note || null) === (note || null));
}
function sigQty(id, note){ const l = sigLine(id, note); return l ? l.qty : 0; }
function addSig(o, delta){
  const {sig:s, v, bits, compl:cp} = o;
  const note = bits.join(' \u00b7 ') || null;
  const l = sigLine(s.id, note);
  let bouge = false;
  if(l){
    l.qty += delta; bouge = true;
    if(l.qty <= 0) state.cart.splice(state.cart.indexOf(l), 1);
  } else if(delta > 0){
    state.cart.push({sig:s.id, label:s.n, price:v.price, note, qty:1,
                     macros:macrosOf(v.comps),
                     components:v.comps.map(x=>x.slice()),
                     custom:bits.length > 0});
    bouge = true;
  }
  /* LE COMPLEMENT SUIT LE BOWL. AJOUTER l'ajoutait deja en ligne a part ;
     s'il ne repartait pas avec le retrait il s'accumulerait sans qu'on
     puisse jamais l'enlever depuis la carte. Et il ne bouge que si le
     bowl a bouge : sinon un « moins » sur une carte a zero mangerait un
     complement pose a la main. */
  if(bouge && cp) addUnit(cp, delta);
  syncBar();
}

/* ---------------------------------------------------------------------
   8 bis. LE CADRE DE DEMONSTRATION ET LE CONTENEUR QUI DEFILE

   Le meme fichier sert de produit et de demo. Hors cadre, c'est la
   fenetre qui defile ; dans le cadre, c'est #app, qui a une hauteur
   fixe de telephone. Tout le code de defilement passe par SC pour qu'il
   n'y ait pas deux versions de chaque calcul.

   QUAND MONTRER LE CADRE. Pas « quand ca rentre » : a 375x812, un
   telephone reduit a 78 % rentrait, et on obtenait un telephone dessine
   dans un telephone. La question est « est-ce un ordinateur ». Donc une
   fenetre nettement plus large qu'un telephone, et un pointeur fin. Au
   doigt, jamais de cadre : c'est le produit, pas sa photo.
   ------------------------------------------------------------------ */
const APP = document.getElementById('app');
const framed = ()=> document.body.classList.contains('framed');
const SC = {
  get y(){ return framed() ? APP.scrollTop : window.scrollY; },
  get h(){ return framed() ? APP.clientHeight : window.innerHeight; },
  get max(){ return framed() ? APP.scrollHeight : document.documentElement.scrollHeight; },
  get top(){ return framed() ? 50 : 0; },
  /* le garde-fou sert aux harnais : jsdom ne fournit scrollTo ni sur la
     fenetre ni sur les elements, et une demo ne doit pas tomber pour un
     defilement qui n'existe pas. */
  to(o){ const el = framed() ? APP : window; if(el && el.scrollTo) el.scrollTo(o); }
};
/* POSITION D'UN ELEMENT DANS LE CONTENU QUI DEFILE, et non a l'ecran.
   getBoundingClientRect ne convient pas ici : dans le cadre, la scene
   porte un transform:scale, qui multiplie les rectangles renvoyes et
   fausse tous les calculs de defilement. La chaine des offsetTop, elle,
   est en pixels de mise en page, donc insensible a l'echelle. #app est
   l'element positionne dans les deux etats, il sert de butee. */
function contentTop(el){
  let y = 0, n = el;
  while(n && n !== APP){ y += n.offsetTop; n = n.offsetParent; }
  return y;
}
function fitFrame(){
  const W = window.innerWidth, H = window.innerHeight;
  const souris = !window.matchMedia || window.matchMedia('(pointer:fine)').matches;
  const on = souris && W >= 820 && H >= 700;
  /* 410 = 390 de telephone + 20 de coque ; 846 = 810 + 20 + la legende */
  const s = Math.min((W - 80) / 410, (H - 80) / 846, 1);
  document.body.classList.toggle('framed', on);
  /* la hauteur utile : l'ecran du telephone dans le cadre, la fenetre
     sinon. 810 - 50 de barre d'etat = 760, soit exactement le seuil. */
  document.body.classList.toggle('tight', on ? true : window.innerHeight <= 760);
  /* UN CRAN DE PLUS POUR LES TRES PETITS ECRANS. Sur un iPhone SE, 667 px,
     la photo rendue sans recadrage fait 266 px a elle seule et le second
     bouton tombait 10 px sous la ligne de flottaison. On reduit le lockup
     plutot que de recadrer la devanture : c'est l'enseigne qu'on perdait. */
  document.body.classList.toggle('short', !on && window.innerHeight <= 700);
  document.documentElement.style.setProperty('--s', on ? s.toFixed(3) : '1');
  if(on){
    const d = new Date();
    document.getElementById('sbTime').textContent =
      d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
  }
}
window.addEventListener('resize', fitFrame);
/* L'observateur de defilement doit ecouter les deux : la fenetre hors
   cadre, #app dans le cadre. On branche les deux une fois pour toutes. */
APP.addEventListener('scroll', ()=>{ if(view === 'v-menu') spyJump(); }, {passive:true});

/* ---------------------------------------------------------------------
   9. ROUTEUR
   ------------------------------------------------------------------ */
const FLOW = ['v-goal','v-body','v-ctx','v-ratio-out'];
let view = 'v-home';
const HISTORY = [];

function show(v, push){
  if(push !== false && view !== v) HISTORY.push(view);
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('on'));
  const el = document.getElementById(v);
  if(el) el.classList.add('on');
  view = v;

  document.getElementById('back').style.visibility = (v==='v-home') ? 'hidden' : 'visible';
  /* LES DEUX ECRANS NOIRS. L'accueil et le RATIO. L'un ouvre, l'autre
     revele : ce sont les deux seuls moments ou l'app ne sert pas a
     choisir mais a annoncer. Le reste du parcours reste creme, sinon
     le noir ne veut plus rien dire. La classe remplace les styles en
     ligne d'avant : elle teint aussi la coque et la barre d'etat du
     telephone, ce qu'un style sur #app ne pouvait pas faire. */
  document.body.classList.toggle('dark', v === 'v-ratio-out' || v === 'v-home');
  document.body.classList.toggle('splash', v === 'v-home');

  const step = FLOW.indexOf(v);
  document.getElementById('prog').classList.toggle('on', step >= 0);
  if(step >= 0)
    document.getElementById('progBar').style.width =
      Math.round((step + 1) / FLOW.length * 100) + '%';

  /* La barre « Suivant » couvre le tunnel sauf son dernier ecran : le
     RATIO a son propre appel a l'action, et il est sur fond encre. */
  document.getElementById('flowbar')
    .classList.toggle('on', step >= 0 && step < FLOW.length - 1);

  if(v==='v-menu')  renderMenu();
  if(v==='v-build') renderBuild();
  if(v==='v-order') renderOrder();
  if(v==='v-ratio-out') renderRatio();
  syncBar();
  SC.to({top:0});
  document.querySelector('main').scrollTop = 0;
}
function goBack(){
  if(view==='v-build' && state.editing){ state.editing=null; }
  const prev = HISTORY.pop();
  show(prev || 'v-menu', false);
}
document.getElementById('back').onclick = goBack;

/* ---------------------------------------------------------------------
   10. BARRE BASSE
   ------------------------------------------------------------------ */
function syncBar(){
  syncBarButtons();
  /* LE RELAIS DE JAUGE SE REPEINT A CHAQUE MOUVEMENT DU PANIER, et
     syncBar est le seul point par lequel passent tous les mouvements :
     stepper d'un jus, ajout d'un bowl, retrait dans le recapitulatif. */
  stripPanel();
  updateGauges();
}
function syncBarButtons(){
  const bar = document.getElementById('bottom');
  const onMenu  = (view==='v-menu');
  const onBuild = (view==='v-build');
  const onRatio = (view==='v-ratio-out');
  const n = cartCount();

  if(onRatio){
    bar.classList.add('on');
    bar.querySelector('.sum').style.visibility = 'hidden';
    document.getElementById('barLabel').textContent = t('ratio.next');
    document.getElementById('barBtn').onclick = ()=>show('v-menu');
    return;
  }
  bar.querySelector('.sum').style.visibility = 'visible';

  if(onBuild){
    const comps = qtyToComponents(state.qty);
    const has = comps.length > 0;
    bar.classList.add('on');
    document.getElementById('barTotal').textContent = eur(has ? priceCustom(comps) : 0);
    document.getElementById('barLabel').textContent = t('build.add');
    const btn = document.getElementById('barBtn');
    btn.disabled = !has;
    btn.onclick = ()=>{
      if(!comps.length) return;
      /* Meme exigence qu'une signature ajustee : la ligne doit porter de
         quoi la fabriquer. "Bowl compose" seul n'est pas servable. */
      state.cart.push({custom:true, label:(LANG==='fr'?'Bowl compos\u00e9':'Custom bowl'),
                       note: comps.map(([k,q])=>
                         nameOf(ITEM[k]) + (q!==1 ? ` \u00d7${q}` : '')).join(' · '),
                       components:comps, price:priceCustom(comps),
                       macros:macrosOf(comps), qty:1});
      state.qty = {}; state.editing = null;
      show('v-order');
    };
    return;
  }

  if(onMenu && n > 0){
    bar.classList.add('on');
    document.getElementById('barTotal').textContent = eur(cartTotal());
    document.getElementById('barLabel').textContent = t('bar.order');
    const btn = document.getElementById('barBtn');
    btn.disabled = false;
    btn.onclick = ()=>show('v-order');
    return;
  }
  bar.classList.remove('on');
}
